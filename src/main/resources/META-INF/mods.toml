[[mods]]
modId="primordial"
version="${file.jarVersion}"
displayName="原初 Primordial"
authors="空之律者-西琳大人"
logoFile="logo.png"
logoBlur=false
description='''原初把 ProjectE 的 EMC 接到机器、资源和装备上。你在转化桌里积累的 EMC，可以直接拿来供给生产线，也可以在生产结束后回收回来。

配置器用于给机器安排供料任务。选定方块、方向和槽位后，它可以输送物品、流体、Mekanism 气体或 Forge 能源；同一台配置器可以管理多个目标，并按设定的 tick 间隔补充。需要维持背包某个槽位，或给支持的装备充能时，也可以使用同一套配置。

EMC 也可以换成植物魔法的魔力、气动工艺的压力、自然灵气、新生魔艺的魔源，以及机械动力的转速和应力。配置器的玩家背包页还可以开启铁魔法法力、诡厄巫法灵魂能量的自动补充。兑换比例可在服务器配置中调整。

黑洞方块和黑洞护符负责回收。方块可以接收有价物品、流体、Mekanism 气体和 Forge 能源；护符放进 Curios 槽位后，会吸收周围掉落物并把价值记回佩戴者的 EMC。黑洞装备还提供无耐久的高阶工具、护甲和弓，功能等级由装备界面用 EMC 解锁。

时间加速器可以同时绑定多个目标，为每个目标设置 2 至 1024 倍的加速倍率。高倍率会显示性能提示，实际工作量仍受服务器预算限制；它适合加速关键机器，不会替服务器凭空增加处理能力。

转化接口可以直接接入 AE2、Refined Storage 和 Beyond Dimensions 网络，不需要存储总线或外部存储方块。接口读取的是绑定玩家的转化桌账户，购买时正常扣除 EMC，模拟请求不会收费。

知识规则仍由 ProjectE 控制。默认只有已经学会的物品才能被配置器和网络接口购买；流体、气体等独立资源通过回收学习或知识凭证解锁。JEI 支持相关配方的拖放，管理员可以调整价格和兑换比例。

机器适配器按模组是否安装启用，已覆盖 Mekanism、Applied Energistics 2、Industrial Foregoing、Immersive Engineering、Ender IO 和 GregTech Modern；其它设备只要公开标准 Forge 能力，也可以使用通用接口。具体行为取决于目标模组版本及其公开的能力。

运行环境：Minecraft 1.20.1 · Forge 47.x
必需前置：ProjectE、Curios API
其余联动模组按需安装。

作者：空之律者-西琳大人'''

[[dependencies.primordial]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.primordial]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"

[[dependencies.primordial]]
    modId="projecte"
    mandatory=true
    versionRange="[1.0.1,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.primordial]]
    modId="curios"
    mandatory=true
    versionRange="[5.9.1,)"
    ordering="AFTER"
    side="BOTH"
